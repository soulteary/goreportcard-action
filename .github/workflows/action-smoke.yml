# Self-hosted usage: this repository grades itself with its own action and
# commits the resulting badge back to the repo.

name: Local Action smoke test

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - '*'

permissions:
  contents: read
jobs:
  badge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        with:
          persist-credentials: false
      - name: Generate badge
        id: grc
        uses: ./  # Development smoke test intentionally exercises the local source
        with:
          directory: "."
          output: ".github/goreportcard.svg"
          report: "true"
          commit: "false"
          version: "source"

      - name: Summary
        run: |
          {
            echo "Grade ${{ steps.grc.outputs.grade }} (${{ steps.grc.outputs.score }}%)"
            echo "Badge: ${{ steps.grc.outputs.badge }}"
            echo "Report: ${{ steps.grc.outputs.report }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stage a project with a different Go toolchain
        shell: bash
        run: |
          mkdir -p _toolchain-fixture
          printf 'module example.com/toolchain-fixture\n\ngo 1.27.2\n' > _toolchain-fixture/go.mod
          printf 'package fixture\n\nfunc Value() int { return 1 }\n' > _toolchain-fixture/fixture.go

      - name: Grade the consumer module
        uses: ./
        with:
          directory: _toolchain-fixture
          output: _toolchain-fixture/quality.svg
          report_output: _toolchain-fixture/quality.md
          commit: "false"
          version: "source"

      - name: Verify consumer Go remains selected
        shell: bash
        run: |
          test "$(go env GOVERSION)" = go1.27.2
          cd _toolchain-fixture
          go list ./...
