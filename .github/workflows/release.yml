# Builds and publishes cross-platform binaries (goreportcard-cli plus the
# linter tools it invokes) to a GitHub Release whenever a version tag is pushed.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. v1.2.3). Used for archive names."
        required: true
        default: "v0.0.0-manual"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release archives
        run: scripts/build-release.sh "${{ steps.version.outputs.value }}"

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/goreportcard_*
            dist/checksums.txt
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Upload artifacts (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: goreportcard-binaries
          path: dist/
