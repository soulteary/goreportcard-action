# Self-hosted usage: this repository grades itself with its own action and
# commits the resulting badge back to the repo.

name: Local Action smoke test

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - '*'

permissions:
  contents: read
jobs:
  badge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        with:
          persist-credentials: false
      - name: Generate badge
        id: grc
        uses: ./  # Development smoke test intentionally exercises the local source
        with:
          directory: "."
          output: ".github/goreportcard.svg"
          report: "true"
          commit: "false"
          version: "source"

      - name: Summary
        run: |
          {
            echo "Grade ${{ steps.grc.outputs.grade }} (${{ steps.grc.outputs.score }}%)"
            echo "Badge: ${{ steps.grc.outputs.badge }}"
            echo "Report: ${{ steps.grc.outputs.report }}"
          } >> "$GITHUB_STEP_SUMMARY"
