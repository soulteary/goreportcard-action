name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

  test:
    name: Unit tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install report-card tools
        shell: bash
        run: |
          go install github.com/client9/misspell/cmd/misspell@latest
          go install github.com/fzipp/gocyclo/cmd/gocyclo@latest
          go install github.com/gordonklaus/ineffassign@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Verify formatting
        if: runner.os != 'Windows'
        shell: bash
        run: |
          fmt_out="$(gofmt -l $(git ls-files '*.go' ':(exclude)check/testdata/*'))"
          if [ -n "$fmt_out" ]; then
            echo "::error::gofmt needed on:"; echo "$fmt_out"; exit 1
          fi

      - name: Vet
        run: go vet ./check/... ./cmd/...

      - name: Test with coverage
        shell: bash
        run: |
          go test -covermode=atomic -coverprofile=coverage.out ./check/... ./cmd/...
          go tool cover -func=coverage.out | tail -n1

        if: "!(github.event_name == 'pull_request' && runner.os == 'Linux')"
      - name: Remove stale generated report evidence
        if: always() && (github.event_name == 'pull_request' && runner.os == 'Linux')
        shell: bash
        run: |
          set -euo pipefail
          test ! -L .github
          rm -f -- .github/go-test-report.md .github/go-test-report.json .github/coverage.svg .github/goreportcard.svg .github/goreportcard-report.md
          rm -rf -- .github/test-results
      - name: Test, race and coverage (GTR v1.1.2)
        id: go_test_report
        uses: soulteary/go-test-report-action@bf04b539f7bf2a6f67d602da4259904b3dcdeba1  # v1.1.2
        with:
          directory: "."
          packages: "./check/... ./cmd/..."
          race: "true"
          coverage_threshold: "70"
          test_args: "-count=1"
          version: "v1.1.2"
          cover_mode: "atomic"
          commit: "false"
        if: github.event_name == 'pull_request' && runner.os == 'Linux'
      - name: Go quality report (v1.1.3)
        id: go_report_card
        uses: soulteary/goreportcard-action@fc43049a5fe61c3313294d217c2a783f375a7970  # v1.1.3
        with:
          directory: "."
          version: "v1.1.3"
          threshold: "0"
          report: "true"
          commit: "false"
        if: github.event_name == 'pull_request' && runner.os == 'Linux'
      - name: Reuse GTR coverage profile
        if: github.event_name == 'pull_request' && runner.os == 'Linux'
        shell: bash
        env:
          PROFILE: ${{ steps.go_test_report.outputs.coverage_profile }}
        run: |-
          cp "$PROFILE" coverage.out
      - name: Enforce project coverage >= 70%
        if: runner.os == 'Linux'
        shell: bash
        run: |
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/,"",$3); print $3}')"
          echo "total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { if (t+0 < 70.0) { printf("::error::project coverage %.2f%% < 70%%\n", t); exit 1 } }'

      - name: Publish reusable PR coverage
        if: github.event_name == 'pull_request' && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pr-linux-coverage
          path: coverage.out
          if-no-files-found: error
      - name: Upload read-only PR quality evidence
        if: always() && (github.event_name == 'pull_request' && runner.os == 'Linux')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pr-go-quality-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .github/go-test-report.md
            .github/go-test-report.json
            .github/coverage.svg
            .github/goreportcard.svg
            .github/goreportcard-report.md
            .github/test-results/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
    permissions:
      contents: read
  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run govulncheck
        shell: bash
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          "$(go env GOPATH)/bin/govulncheck" ./check/... ./cmd/...

  patch-coverage:
    name: Patch coverage (>= 90% on new lines)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install report-card tools
        shell: bash
        run: |
          go install github.com/client9/misspell/cmd/misspell@latest
          go install github.com/fzipp/gocyclo/cmd/gocyclo@latest
          go install github.com/gordonklaus/ineffassign@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Self-test the patch-coverage script
        shell: bash
        run: bash scripts/check-patch-coverage.sh --selftest

      - name: Reuse tested Linux coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: pr-linux-coverage
      - name: Enforce patch coverage
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
          PATCH_COVERAGE_MIN: "90"
        run: bash scripts/check-patch-coverage.sh coverage.out
    needs:
      - test
